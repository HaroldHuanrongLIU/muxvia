name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
          - os: ubuntu-latest
            target: linux-glibc-x64
            rust-target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64-baseline
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain stable action snapshot (2026-08-05)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # actions/cache v4.3.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
          key: ${{ runner.os }}-deps-${{ hashFiles('Cargo.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Build native release executables
        env:
          MUXVIA_BUNDLE_TARGET: ${{ matrix.target }}
          MUXVIA_BUNDLE_BUILD: ${{ github.sha }}
        run: |
          cargo build --release --locked --target "${{ matrix.rust-target }}" -p muxvia-routing
          mkdir -p build
          bun run release:control-plane \
            --target "${{ matrix.bun-target }}" \
            --output build/muxvia \
            --release 0.1.0 \
            --routing-release 0.1.0 \
            --bundle-target "${{ matrix.target }}" \
            --build "${{ github.sha }}"
      - name: Inspect, scan, and smoke the native bundle
        run: |
          bun run release:bundle assemble \
            --release 0.1.0 \
            --target "${{ matrix.target }}" \
            --build "${{ github.sha }}" \
            --control-plane build/muxvia \
            --routing-service "target/${{ matrix.rust-target }}/release/muxvia-routing" \
            --output "build/muxvia-0.1.0-${{ matrix.target }}"
          bun run release:bundle inspect \
            --root "build/muxvia-0.1.0-${{ matrix.target }}" \
            --release 0.1.0 \
            --target "${{ matrix.target }}" \
            --build "${{ github.sha }}"
          bun run release:bundle scan --root "build/muxvia-0.1.0-${{ matrix.target }}"
          bun run release:bundle smoke \
            --root "build/muxvia-0.1.0-${{ matrix.target }}" \
            --release 0.1.0
