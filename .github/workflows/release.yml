name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    name: release quality (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain stable action snapshot (2026-08-05)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run verify

  bundle:
    name: bundle (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
          - target: linux-glibc-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            bun-target: bun-linux-arm64
          - target: linux-glibc-x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64-baseline
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain stable action snapshot (2026-08-05)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Match tag to the locked product release
        id: release
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          test "$release" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/routing-service/Cargo.toml | head -1)"
          test "$release" = "$(node -p "require('./packages/npm-launcher/package.json').version")"
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
      - name: Build release executables
        env:
          MUXVIA_BUNDLE_TARGET: ${{ matrix.target }}
          MUXVIA_BUNDLE_BUILD: ${{ github.sha }}
        run: |
          cargo build --release --locked --target "${{ matrix.rust-target }}" -p muxvia-routing
          mkdir -p build
          bun run release:control-plane \
            --target "${{ matrix.bun-target }}" \
            --output build/muxvia \
            --release "${{ steps.release.outputs.release }}" \
            --routing-release "${{ steps.release.outputs.release }}" \
            --bundle-target "${{ matrix.target }}" \
            --build "${{ github.sha }}"
      - name: Assemble and verify release archive
        run: |
          bundle="build/muxvia-${{ steps.release.outputs.release }}-${{ matrix.target }}"
          archive="build/muxvia-${{ steps.release.outputs.release }}-${{ matrix.target }}.tar.gz"
          bun run release:bundle assemble \
            --release "${{ steps.release.outputs.release }}" \
            --target "${{ matrix.target }}" \
            --build "${{ github.sha }}" \
            --control-plane build/muxvia \
            --routing-service "target/${{ matrix.rust-target }}/release/muxvia-routing" \
            --output "$bundle"
          bun run release:bundle inspect \
            --root "$bundle" \
            --release "${{ steps.release.outputs.release }}" \
            --target "${{ matrix.target }}" \
            --build "${{ github.sha }}"
          bun run release:bundle scan --root "$bundle"
          bun run release:bundle archive --root "$bundle" --output "$archive"
          mkdir -p build/extracted
          tar -xzf "$archive" -C build/extracted
          bun run release:bundle smoke \
            --root "build/extracted/$(basename "$bundle")" \
            --release "${{ steps.release.outputs.release }}"
          archive_home="$(mktemp -d)"
          HOME="$archive_home" MUXVIA_UPDATE_CHECK=0 \
            "build/extracted/$(basename "$bundle")/muxvia" doctor --json \
            || test "$?" -eq 78
          rm -rf "build/extracted/$(basename "$bundle")" "$archive_home"
          installer_assets="$(pwd)/build/installer-assets"
          installer_release="$installer_assets/releases/v${{ steps.release.outputs.release }}"
          installer_home="$(mktemp -d)"
          mkdir -p "$installer_release"
          cp "$archive" "$installer_release/$(basename "$archive")"
          archive_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '{\n  "schemaVersion": 1,\n  "product": "muxvia",\n  "release": "%s",\n  "bundles": [\n    {\n      "target": "%s",\n      "archive": "%s",\n      "sha256": "%s"\n    }\n  ]\n}\n' \
            "${{ steps.release.outputs.release }}" \
            "${{ matrix.target }}" \
            "$(basename "$archive")" \
            "$archive_sha" > "$installer_assets/muxvia-latest.json"
          HOME="$installer_home" \
            MUXVIA_INSTALLER_TESTING=1 \
            MUXVIA_INSTALLER_TEST_MANIFEST_URL="file://$installer_assets/muxvia-latest.json" \
            MUXVIA_INSTALLER_TEST_RELEASES_URL="file://$installer_assets/releases" \
            sh scripts/install.sh
          HOME="$installer_home" "$installer_home/.muxvia/bin/muxvia" version --json
          HOME="$installer_home" MUXVIA_UPDATE_CHECK=0 \
            "$installer_home/.muxvia/bin/muxvia" doctor --json \
            || test "$?" -eq 78
          HOME="$installer_home" \
            PATH="$installer_home/.muxvia/bin:$PATH" \
            MUXVIA_INSTALLER_TESTING=1 \
            MUXVIA_INSTALLER_TEST_MANIFEST_URL="file://$installer_assets/muxvia-latest.json" \
            MUXVIA_INSTALLER_TEST_RELEASES_URL="file://$installer_assets/releases" \
            sh scripts/install.sh
          HOME="$installer_home" MUXVIA_UPDATE_CHECK=0 \
            "$installer_home/.muxvia/bin/muxvia" doctor --json \
            || test "$?" -eq 78
          rm -rf "$installer_home/.muxvia/install"
          rm -f "$installer_home/.muxvia/bin/muxvia"
          test ! -e "$installer_home/.muxvia/install"
          test ! -e "$installer_home/.muxvia/bin/muxvia"
      - name: Pack and smoke the npm installation
        run: |
          package_root="$(pwd)/build/npm/platform"
          tarballs="$(pwd)/build/npm/tarballs"
          smoke_root="$(pwd)/build/npm/smoke"
          mkdir -p "$tarballs" "$smoke_root"
          bun run release:npm assemble-platform \
            --root "build/muxvia-${{ steps.release.outputs.release }}-${{ matrix.target }}" \
            --release "${{ steps.release.outputs.release }}" \
            --target "${{ matrix.target }}" \
            --build "${{ github.sha }}" \
            --output "$package_root"
          bun run release:npm inspect-platform \
            --root "$package_root" \
            --release "${{ steps.release.outputs.release }}" \
            --target "${{ matrix.target }}" \
            --build "${{ github.sha }}"
          bun run release:npm inspect-launcher \
            --root packages/npm-launcher \
            --release "${{ steps.release.outputs.release }}"
          npm pack "$package_root" --pack-destination "$tarballs" --silent
          npm pack ./packages/npm-launcher --pack-destination "$tarballs" --silent
          npm install \
            --prefix "$smoke_root" \
            --offline \
            --ignore-scripts \
            --omit=optional \
            --package-lock=false \
            "$tarballs/muxvia-${{ steps.release.outputs.release }}.tgz" \
            "$tarballs/muxvia-${{ matrix.target }}-${{ steps.release.outputs.release }}.tgz"
          MUXVIA_UPDATE_CHECK=0 "$smoke_root/node_modules/.bin/muxvia" version --json
          MUXVIA_UPDATE_CHECK=0 "$smoke_root/node_modules/.bin/muxvia" doctor --json \
            || test "$?" -eq 78
          npm install \
            --prefix "$smoke_root" \
            --offline \
            --ignore-scripts \
            --omit=optional \
            --package-lock=false \
            "$tarballs/muxvia-${{ steps.release.outputs.release }}.tgz" \
            "$tarballs/muxvia-${{ matrix.target }}-${{ steps.release.outputs.release }}.tgz"
          MUXVIA_UPDATE_CHECK=0 "$smoke_root/node_modules/.bin/muxvia" version --json
          npm uninstall \
            --prefix "$smoke_root" \
            --ignore-scripts \
            --package-lock=false \
            muxvia "@muxvia/${{ matrix.target }}"
          test ! -e "$smoke_root/node_modules/.bin/muxvia"
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: muxvia-${{ steps.release.outputs.release }}-${{ matrix.target }}
          path: |
            build/muxvia-${{ steps.release.outputs.release }}-${{ matrix.target }}.tar.gz
            build/npm/tarballs/muxvia-${{ matrix.target }}-${{ steps.release.outputs.release }}.tgz
          if-no-files-found: error
          retention-days: 7

  homebrew:
    name: homebrew (${{ matrix.target }})
    needs: bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # actions/download-artifact v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: muxvia-*
          path: release
          merge-multiple: true
      - name: Generate and verify the official tap formula
        id: release
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          bun run release:bundle public-manifest \
            --release "$release" \
            --archives release \
            --output release/muxvia-latest.json
          bun run release:homebrew generate \
            --manifest release/muxvia-latest.json \
            --archive-base-url "file://${PWD}/release" \
            --output build/homebrew/install/Formula/muxvia.rb
          bun run release:homebrew generate \
            --manifest release/muxvia-latest.json \
            --archive-base-url "file://${PWD}/release" \
            --revision 1 \
            --output build/homebrew/upgrade/Formula/muxvia.rb
          bun run release:homebrew verify \
            --manifest release/muxvia-latest.json \
            --archive-base-url "file://${PWD}/release" \
            --formula build/homebrew/install/Formula/muxvia.rb
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
      - name: Smoke Homebrew ownership and complete-bundle lifecycle
        run: |
          bun run release:homebrew:smoke \
            --formula build/homebrew/install/Formula/muxvia.rb \
            --upgrade-formula build/homebrew/upgrade/Formula/muxvia.rb \
            --release "${{ steps.release.outputs.release }}"

  compatibility:
    name: compatibility (${{ matrix.target }} ${{ matrix.evidence }} ${{ matrix.version }})
    needs: bundle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: codex
            evidence: first
            package: "@openai/codex"
            version: 0.147.0
          - target: codex
            evidence: latest
            package: "@openai/codex"
            version: 0.149.0
          - target: claude
            evidence: first
            package: "@anthropic-ai/claude-code"
            version: 2.1.228
          - target: claude
            evidence: latest
            package: "@anthropic-ai/claude-code"
            version: 2.1.239
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # actions/download-artifact v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: muxvia-*-linux-glibc-x64
          path: release
          merge-multiple: true
      - name: Prove the pinned Target CLI boundary
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          archive="release/muxvia-${release}-linux-glibc-x64.tar.gz"
          mkdir -p release/extracted
          tar -xzf "$archive" -C release/extracted
          npm install \
            --prefix target-cli \
            --ignore-scripts \
            --package-lock=false \
            "${{ matrix.package }}@${{ matrix.version }}"
          PATH="$PWD/target-cli/node_modules/.bin:$PATH" \
            bun run release:qualification compatibility \
              --policy release/qualification-policy.json \
              --muxvia "release/extracted/muxvia-${release}-linux-glibc-x64/muxvia" \
              --target "${{ matrix.target }}" \
              --evidence "${{ matrix.evidence }}" \
              --version "${{ matrix.version }}" \
              --release "$release" \
              --build "${{ github.sha }}" \
              --output "release/muxvia-compatibility-${{ matrix.target }}-${{ matrix.evidence }}-${{ matrix.version }}.json"
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-${{ matrix.target }}-${{ matrix.evidence }}
          path: release/muxvia-compatibility-${{ matrix.target }}-${{ matrix.evidence }}-${{ matrix.version }}.json
          if-no-files-found: error
          retention-days: 7

  qualification:
    name: qualify four release channels
    needs: [bundle, homebrew, compatibility]
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # actions/download-artifact v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: "*"
          path: release
          merge-multiple: true
      - name: Generate the canonical four-channel qualification record
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          bun run release:bundle public-manifest \
            --release "$release" \
            --archives release \
            --output release/muxvia-latest.json
          bun run release:homebrew generate \
            --manifest release/muxvia-latest.json \
            --output release/muxvia.rb
          install -m 0755 scripts/install.sh release/install.sh
          bun run release:qualification record \
            --policy release/qualification-policy.json \
            --artifacts release \
            --manifest release/muxvia-latest.json \
            --formula release/muxvia.rb \
            --installer release/install.sh \
            --launcher packages/npm-launcher \
            --release "$release" \
            --build "${{ github.sha }}" \
            --output release/muxvia-qualification.json
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: muxvia-qualified-${{ github.ref_name }}
          path: |
            release/muxvia-latest.json
            release/muxvia.rb
            release/install.sh
            release/muxvia-qualification.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release channels
    needs: qualification
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # actions/download-artifact v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: muxvia-*
          path: release
          merge-multiple: true
      - name: Verify the qualified release identity
        id: release
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          test "$release" = "$(node -p "require('./packages/npm-launcher/package.json').version")"
          bun run release:homebrew verify \
            --manifest release/muxvia-latest.json \
            --formula release/muxvia.rb
          cmp -s scripts/install.sh release/install.sh
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
      - name: Publish and verify every npm platform package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          release="${{ steps.release.outputs.release }}"
          staging_tag="release-${GITHUB_RUN_ID}"
          mkdir -p release/npm-verified
          for target in darwin-arm64 darwin-x64 linux-glibc-arm64 linux-glibc-x64; do
            npm publish "release/muxvia-${target}-${release}.tgz" \
              --access public \
              --tag "$staging_tag"
          done
          for target in darwin-arm64 darwin-x64 linux-glibc-arm64 linux-glibc-x64; do
            verified="release/npm-verified/${target}"
            mkdir -p "$verified/extracted"
            tarball="$(npm pack "@muxvia/${target}@${release}" --pack-destination "$verified" --silent)"
            tar -xzf "$verified/$tarball" -C "$verified/extracted"
            bun run release:npm inspect-platform \
              --root "$verified/extracted/package" \
              --release "$release" \
              --target "$target" \
              --build "${{ github.sha }}"
          done
      - name: Publish and verify the npm launcher without moving its public tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          release="${{ steps.release.outputs.release }}"
          staging_tag="release-${GITHUB_RUN_ID}"
          bun run release:npm inspect-launcher --root packages/npm-launcher --release "$release"
          launcher_tarball="$(npm pack ./packages/npm-launcher --pack-destination release --silent)"
          npm publish "release/$launcher_tarball" --access public --tag "$staging_tag"
          mkdir -p release/npm-verified/launcher/extracted
          verified_tarball="$(npm pack "muxvia@${release}" \
            --pack-destination release/npm-verified/launcher \
            --silent)"
          tar -xzf "release/npm-verified/launcher/$verified_tarball" \
            -C release/npm-verified/launcher/extracted
          bun run release:npm inspect-launcher \
            --root release/npm-verified/launcher/extracted/package \
            --release "$release"
      - name: Move the verified npm launcher to the public distribution tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add "muxvia@${{ steps.release.outputs.release }}" latest
      - name: Publish all verified artifacts together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tar.gz \
            release/muxvia-latest.json \
            release/muxvia-qualification.json \
            release/muxvia.rb \
            release/install.sh \
            --verify-tag \
            --generate-notes \
            --title "Muxvia ${{ steps.release.outputs.release }}"

  publish-homebrew-tap:
    name: publish official Homebrew tap
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Download and verify the released formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern muxvia-latest.json \
            --pattern muxvia.rb \
            --dir released
          bun run release:homebrew verify \
            --manifest released/muxvia-latest.json \
            --formula released/muxvia.rb
      - name: Check out the official Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HaroldHuanrongLIU/homebrew-muxvia
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-muxvia
      - name: Publish the exact verified formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p homebrew-muxvia/Formula
          cp released/muxvia.rb homebrew-muxvia/Formula/muxvia.rb
          cmp -s released/muxvia.rb homebrew-muxvia/Formula/muxvia.rb
          git -C homebrew-muxvia add Formula/muxvia.rb
          if git -C homebrew-muxvia diff --cached --quiet; then
            echo "Official tap already contains $RELEASE_TAG"
            exit 0
          fi
          git -C homebrew-muxvia config user.name "github-actions[bot]"
          git -C homebrew-muxvia config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-muxvia commit -m "muxvia ${RELEASE_TAG#v}"
          git -C homebrew-muxvia push origin HEAD
